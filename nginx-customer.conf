# Customer website (the built files in dist/). Replace yourdomain.com, then see ../README.md (step 9).
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/errandboy/customer/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Settings, shop catalogue and the page are always fetched fresh after you edit them
    location = /config.js    { expires -1; }
    location = /catalog.json { expires -1; }
    location = /index.html   { expires -1; }

    # Pictures rarely change; css and js are re-checked hourly
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { expires 30d; }
    location ~* \.(css|js)$                    { expires 1h; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
